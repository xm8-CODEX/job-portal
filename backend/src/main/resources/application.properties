# ===================================================================
# NaukriSetu Application Configuration
# ===================================================================
spring.application.name=naukrisetu-backend
server.port=8080

# ===================================================================
# Oracle Database Configuration
# ===================================================================
# Option 1: Standard Oracle XE / Service Name (Recommended)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/xe
# Option 2 (If XE Service Name is XEPDB1):
# spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
# Option 3 (If using SID like :xe or :orcl):
# spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe

spring.datasource.username=system
spring.datasource.password=system
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===================================================================
# JPA & Hibernate Configuration for Oracle
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false

# ===================================================================
# JWT Security Configuration
