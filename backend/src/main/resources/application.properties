# ===================================================================
# NaukriSetu Application Configuration - Replit Environment
# ===================================================================
spring.application.name=naukrisetu-backend

# Replit assigns port via PORT env variable, fallback to 8080
server.port=${PORT:8080}

# ===================================================================
# H2 In-Memory Database (Replit me Oracle/MySQL install nahi hota)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:naukrisetu_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Debug ke liye - /h2-console par available)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# JPA & Hibernate Configuration (H2 compatible)
# ===================================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ===================================================================
# JWT Security Configuration
# ===================================================================
